name: L6 final one-shot
on:
  push:
    branches:
      - chat/context-l6-adaptive-control-20260907
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply explicit prefetch coverage semantics
        run: python patch_prefetch_coverage.py
      - name: Validate complete L6 tree
        run: |
          python -m unittest discover -s tests -v
          python model.py
          python real_model.py --fixture fixtures/sample_sessions.json
          python task_economics.py --receipts fixtures/run_receipts.json --control no-compression --treatment aggressive-compression
          python adaptive_control.py telemetry --events fixtures/context_access_events.json
          python adaptive_control.py residency --events fixtures/context_access_events.json --catalog fixtures/context_assets.json --budget 14 --min-demand-tasks 4 --min-asset-demands 2
          python adaptive_control.py prefetch --events fixtures/context_access_events.json --catalog fixtures/context_assets.json --seed repo-map --budget 4 --min-seed-demands 3 --min-joint-tasks 2
          python adaptive_control.py budget --state fixtures/context_budget_state.json
          python adaptive_control.py locator --locator-units 20 --carry-cost 0.1 --fetch-probability 0.4 --search-avoided 8 --fetch-cost 0.5
          python adaptive_control.py amplification --mutation-id ci-demo --semantic-source-units 2 --storage-bytes-changed 20 --recomputed-tokens 10 --compute-ms 30 --invalidated-cache-tokens 40 --derived-writes 5
          python adaptive_control.py share --base-units 100 --consumers 3 --private-delta-units 10
          git diff --check
      - name: Commit final L6 code patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adaptive_control.py tests/test_adaptive_control.py
          git commit -m 'fix: make L6 prefetch coverage explicitly labeled'
          git push origin HEAD:chat/context-l6-adaptive-control-20260907
