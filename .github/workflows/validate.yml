name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stdlib-models:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic model smoke test
        run: python model.py
      - name: Portable replay smoke test
        run: python real_model.py --fixture fixtures/sample_sessions.json
      - name: Task economics smoke test
        run: >-
          python task_economics.py
          --receipts fixtures/run_receipts.json
          --control no-compression
          --treatment aggressive-compression
